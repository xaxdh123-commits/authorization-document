limit_req_zone $binary_remote_addr zone=health_limit:10m rate=10r/s;

server {
    listen 80;
    server_name authorization.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name authorization.example.com;
    ssl_certificate     C:/authorization/tls/fullchain.pem;
    ssl_certificate_key C:/authorization/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(),microphone=(),geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;

    include C:/authorization/www/current-release.conf;

    location = /api/health {
        limit_req zone=health_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering on;
    }

    location /admin/ {
        alias $static_release_root/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /p/ {
        alias $static_release_root/h5/;
        try_files $uri $uri/ /p/index.html;
    }

    location = / { return 302 /admin/; }
}

# 若必须使用子域，可将 Admin/H5 分别拆成 admin.example.com/forms.example.com；
# API 仍应只接受显式 CORS 白名单并保留上述 TLS、安全头和上传限制。
